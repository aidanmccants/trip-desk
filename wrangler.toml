name = "trip-desk"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/oauth/*"]

# Optional variables (set in .dev.vars locally, or as Worker variables in the dashboard):
#   OAUTH_CLIENT_ID     client id from `npm run register`. Leave unset in production to use the
#                       client-metadata-document id (https://<host>/oauth/client-metadata.json).
#   OAUTH_REDIRECT_URI  defaults to https://<request host>/auth/callback.
#   OAUTH_CLIENT_SECRET only if Tripsy issued one (`npx wrangler secret put OAUTH_CLIENT_SECRET`).
# Don't add them under [vars] here: an empty [vars] value overrides .dev.vars.

# Create with `npx wrangler kv namespace create SESSIONS` and paste the id here.
[[kv_namespaces]]
binding = "SESSIONS"
id = "f0374cbc327842d2a2bdd51a1eb8fc9a"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[observability]
enabled = true
