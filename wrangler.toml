name = "trip-desk"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/oauth/*"]

[vars]
# Client id from `npm run register`. Leave empty in production to use the
# client-metadata-document id (https://<host>/oauth/client-metadata.json) instead.
OAUTH_CLIENT_ID = ""
# Leave empty to derive https://<request host>/auth/callback.
OAUTH_REDIRECT_URI = ""

# Create with `npx wrangler kv namespace create SESSIONS` and paste the id here.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[observability]
enabled = true
